let autoTripDayInitialized = false;

function tripDayIndex(){
  const now = new Date();
  const start = new Date(2026,8,14); // 14.9.2026
  const end   = new Date(2026,8,24); // 24.9.2026

  const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());

  if(today < start || today > end) return -1;

  return Math.round((today-start)/86400000);
}

function initializeTripDay(){
  if(autoTripDayInitialized) return;

  const i = tripDayIndex();

  if(i >= 0 && i < days.length){
    selected = i;
  }

  autoTripDayInitialized = true;
}

function timeUntil(iso){
  const diff = new Date(iso).getTime() - Date.now();

  if(diff <= 0){
    return 'הגיע זמן הטיסה';
  }

  const totalMinutes = Math.floor(diff/60000);
  const daysLeft = Math.floor(totalMinutes/1440);
  const hoursLeft = Math.floor((totalMinutes%1440)/60);
  const minutesLeft = totalMinutes%60;

  if(daysLeft > 0){
    return `בעוד ${daysLeft} ימים, ${hoursLeft} שעות ו-${minutesLeft} דקות`;
  }

  return `בעוד ${hoursLeft} שעות ו-${minutesLeft} דקות`;
}

async function loadCurrencyRates(force=false){

  const box=document.getElementById('currencyRates');
  const updated=document.getElementById('currencyUpdated');

  if(!box) return;

  if(!force){
    const saved=localStorage.getItem('albaniaCurrencyRates');

    if(saved){
      try{
        const data=JSON.parse(saved);
        showCurrencyRates(data);
      }catch(e){}
    }
  }

  try{

    const response=
      await fetch('https://open.er-api.com/v6/latest/EUR');

    if(!response.ok){
      throw new Error('rate error');
    }

    const data=await response.json();

    const all=data.rates.ALL;
    const ils=data.rates.ILS;

    const rates={
      allToIls:(1000/all)*ils,
      allToEur:1000/all,
      eurToIls:ils,
      updated:new Date().toLocaleString('he-IL')
    };

    localStorage.setItem(
      'albaniaCurrencyRates',
      JSON.stringify(rates)
    );

    showCurrencyRates(rates);

  }catch(e){

    const saved=localStorage.getItem('albaniaCurrencyRates');

    if(saved){
      const data=JSON.parse(saved);
      showCurrencyRates(data,true);
    }else{
      box.innerHTML=
        '<p>לא ניתן כרגע לקבל שערי מטבע. נסו שוב כשיש חיבור לאינטרנט.</p>';
    }
  }
}

function showCurrencyRates(rates,offline=false){

  const box=document.getElementById('currencyRates');
  const updated=document.getElementById('currencyUpdated');

  if(!box) return;

  box.innerHTML=`
    <div style="
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:12px">

      <div style="
        background:#f4f7f8;
        border-radius:16px;
        padding:14px;
        text-align:center">

        <small>1000 לק</small>
        <strong style="display:block;font-size:22px;margin-top:5px">
          ₪${rates.allToIls.toFixed(2)}
        </strong>
      </div>

      <div style="
        background:#f4f7f8;
        border-radius:16px;
        padding:14px;
        text-align:center">

        <small>1000 לק</small>
        <strong style="display:block;font-size:22px;margin-top:5px">
          €${rates.allToEur.toFixed(2)}
        </strong>
      </div>

      <div style="
        background:#f4f7f8;
        border-radius:16px;
        padding:14px;
        text-align:center">

        <small>1 יורו</small>
        <strong style="display:block;font-size:22px;margin-top:5px">
          ₪${rates.eurToIls.toFixed(2)}
        </strong>
      </div>

    </div>
  `;

  if(updated){
    updated.textContent=
      (offline?'⚠️ שער אחרון שנשמר · ':'עודכן: ')
      +rates.updated;
  }
}

function webtab(){return title('🌐 המלצות','מה לבדוק סמוך ליום הטיול','מידע שמשתנה בזמן אמת.')+`<div class="tiles"><div class="tile"><div class="ico">🌤️</div><h3>מזג אוויר</h3><p>חשוב במיוחד בת׳ת, נהר שאלה וואלבונה.</p></div><div class="tile"><div class="ico">🚤</div><h3>שיט</h3><p>לאשר יום קודם שעה, איסוף ומצב הים/הנהר.</p></div><div class="tile"><div class="ico">🕒</div><h3>שעות פתיחה</h3><p>לבדוק סמוך לביקור.</p></div></div>`}
let countdownTimer;
function updateCountdown(){let remaining=Math.max(0,new Date('2026-09-14T17:20:00+03:00').getTime()-Date.now()),daysLeft=Math.floor(remaining/86400000),hoursLeft=Math.floor(remaining%86400000/3600000),minutesLeft=Math.floor(remaining%3600000/60000),secondsLeft=Math.floor(remaining%60000/1000),values=[daysLeft,hoursLeft,minutesLeft,secondsLeft],ids=['countdownDays','countdownHours','countdownMinutes','countdownSeconds'];ids.forEach((id,i)=>{let element=document.getElementById(id);if(element)element.textContent=String(values[i]).padStart(2,'0')})}
function startCountdown(){clearInterval(countdownTimer);if(tab==='plan'){updateCountdown();countdownTimer=setInterval(updateCountdown,1000)}}
function render(){renderNav();app.innerHTML=tab==='home'?home():tab==='today'?today():tab==='plan'?plan():tab==='attr'?attr():tab==='tools'?tools():tab==='food'?food():tab==='near'?near():tab==='lang'?lang():webtab();
 if(tab==='tools'){
  setTimeout(()=>loadCurrencyRates(),100);
}                 startCountdown()}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
