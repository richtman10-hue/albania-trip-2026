function tripDayIndex(){
  const now = new Date();
  const start = new Date(2026,8,14); // 14.9.2026
  const end   = new Date(2026,8,24); // 24.9.2026

  const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());

  if(today < start || today > end) return -1;

  return Math.round((today-start)/86400000);
}

function initializeTripDay(){

  const i = tripDayIndex();

}

function timeUntil(iso){
  const diff = new Date(iso).getTime() - Date.now();

  if(diff <= 0){
    return 'הגיע זמן הטיסה';
  }

  const totalMinutes = Math.floor(diff/60000);
  const daysLeft = Math.floor(totalMinutes/1440);
  const hoursLeft = Math.floor((totalMinutes%1440)/60);
  const minutesLeft = totalMinutes%60;

  if(daysLeft > 0){
    return `בעוד ${daysLeft} ימים, ${hoursLeft} שעות ו-${minutesLeft} דקות`;
  }

  return `בעוד ${hoursLeft} שעות ו-${minutesLeft} דקות`;
}

          ג׳יפ מקומי מומלץ לקיצור הדרך · יום בקצב רגוע
        </div>
      </div>
    `;
  }

  if([2,5,7,8,10].includes(d.day)){
    return `
      <div style="${baseStyle}">
        <div style="font-size:30px">🚗</div>
        <h2 style="margin:5px 0;color:white">
          יום מעבר · ${d.city}
        </h2>
        <div>
          זמן נסיעה משוער: ${d.drive}
        </div>
      </div>
    `;
  }

  return `
    <div style="${baseStyle}">
      <div style="font-size:30px">${d.icon}</div>
      <h2 style="margin:5px 0;color:white">
        ${d.city}
      </h2>
      <div>
        היום בקצב שלנו · ${d.drive}
      </div>
    </div>
  `;
}

function today(){

  initializeTripDay();

  let d = days[selected];

  let map =
    `https://www.google.com/maps?q=${encodeURIComponent(d.en)}&output=embed`;

  return title(
    '☀️ היום שלי',
    `יום ${d.day} · ${d.date}`,
    'התוכנית המרכזית, ניווט, מזג אוויר, אוכל ומפת היום.'
  )

  + strip()

  + dayHero(d)

  + `
  <div class="grid">

    <section class="card">

      <div class="top">

        <div>

          <small>
            יום ${d.day} · ${d.date}
          </small>

          <h2>
            <a
              target="_blank"
              href="${mapsUrl(d.en)}"
              style="
                color:#087487;
                text-decoration:underline;
                text-underline-offset:3px">
              ${d.city}
            </a>
          </h2>

        </div>

        <div class="bigico">
          ${d.icon}
        </div>

      </div>

      <div class="tags">

        <span class="tag">
          קושי: ${d.difficulty}
        </span>

        <span class="tag">
          ${d.drive}
        </span>

        <span class="tag">
          לינה: ${linkPlaces(d.sleep)}
        </span>

      </div>

      ${dailyActions(d)}

      <h3 style="margin-top:22px">
        📋 מה עושים היום
      </h3>

      ${d.plan.map((p,i)=>`
        <div class="step">

          <span class="num">
            ${i+1}
          </span>

          <span>
            ${linkPlaces(p)}
          </span>

        </div>
      `).join('')}

      <div class="tips">

        <b>
          💡 דגשים שלנו
        </b>

        <br>

        ${d.tips.map(t=>'• '+t).join('<br>')}

      </div>

    </section>

    <iframe
      loading="lazy"
      src="${map}">
    </iframe>

  </div>
  `;
}
function plan(){return title('🗓️ תכנון','מסלול, טיסות ומשימות','מהנחיתה ועד החזרה.')+`<section class="flights" aria-labelledby="flights-title"><h3 id="flights-title">✈️ הטיסות שלנו</h3><div class="flightGrid"><article class="flightCard"><div class="flightHead"><div><small>טיסת הלוך · 14.9.2026</small><h4>ישראייר</h4></div><span class="flightCode">6H 163</span></div><div class="flightRoute">תל אביב → טירנה, אלבניה</div><div class="flightDetails"><span><b>המראה:</b> 17:20 · נמל התעופה בן גוריון, טרמינל 1</span><span><b>נחיתה:</b> 19:15 · טירנה, אלבניה</span></div><div class="countdownWrap"><b>הספירה לאחור להמראה</b><div class="countdown" id="flightCountdown" aria-live="polite"><div class="countdownBox"><strong id="countdownDays">00</strong><span>ימים</span></div><div class="countdownBox"><strong id="countdownHours">00</strong><span>שעות</span></div><div class="countdownBox"><strong id="countdownMinutes">00</strong><span>דקות</span></div><div class="countdownBox"><strong id="countdownSeconds">00</strong><span>שניות</span></div></div></div></article><article class="flightCard"><div class="flightHead"><div><small>טיסת חזור · 24.9.2026</small><h4>ישראייר</h4></div><span class="flightCode">6H 162</span></div><div class="flightRoute">טירנה → תל אביב</div><div class="flightDetails"><span><b>המראה:</b> 11:45 · טירנה</span><span><b>נחיתה:</b> 15:30 · תל אביב</span></div></article></div></section><div class="route">${days.map(d=>`<div class="routeItem"><div class="round">${d.icon}</div><div><small>${d.date} · יום ${d.day}</small><b style="display:block">${d.city}</b><small>${d.drive} · לינה: ${d.sleep}</small></div></div>`).join('')}</div>`}
function attr(){return title('🏰 אטרקציות','העיקר, בלי להעמיס','רמת קושי לכל מקום.')+`<div class="tiles">${attractions.map(a=>`<div class="tile"><div class="ico">${a[1]}</div><small>${a[0]}</small><h3>${a[2]}</h3><b>קושי: ${a[3]}</b></div>`).join('')}</div>`}
function tools(){let d=days[selected];return title('🧰 כלים','כל מה שצריך בדרך','ניווט, מטבע, נהיגה וחירום.')+`<div class="tiles"><div class="tile"><div class="ico">🗺️</div><h3>Google Maps</h3><a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.en)}">פתח ל-${d.city}</a></div><div class="tile"><div class="ico">💶</div><h3>מטבע</h3><p>לק אלבני (ALL). מומלץ להחזיק מזומן קטן.</p></div><div class="tile"><div class="ico">🚗</div><h3>נהיגה</h3><p>בכבישים הרריים לא למהר ולהשאיר מרווח זמן.</p></div><div class="tile"><div class="ico">🎒</div><h3>לתיק היומי</h3><p>מים, כובע, שכבה חמה, משקפי שמש ומטען נייד.</p></div><div class="tile"><div class="ico">📞</div><h3>חירום</h3><p>112 — מספר החירום האירופי.</p></div><div class="tile"><div class="ico">🥾</div><h3>קצב</h3><p>מתחילים קל ובודקים את השטח לפני שממשיכים.</p></div></div>`}
function food(){let x=[['🥐','Byrek','מאפה מקומי במילוי גבינה, תרד או בשר'],['🍲','Tavë Kosi','כבש אפוי עם יוגורט וביצה'],['🍢','Qofte','קציצות מתובלות'],['🐟','דג טרי','מומלץ בחוף ובשקודר'],['🍨','קפה וגלידה','עצירה רגועה בוולורה ובטירנה']];return title('🍜 אוכל','מה כדאי לטעום','כמה מנות מקומיות בדרך.')+`<div class="tiles">${x.map(a=>`<div class="tile"><div class="ico">${a[0]}</div><h3>${a[1]}</h3><p>${a[2]}</p></div>`).join('')}</div>`}
function near(){return title('📍 סביבי','מה יש קרוב אלינו','פתחו חיפוש סביב המיקום הנוכחי.')+`<div class="card"><button class="btn" onclick="locate()">📍 מצא את המיקום שלי</button><div id="nearout" style="margin-top:15px"></div></div>`}
function locate(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{let q=['מסעדות','בתי קפה','בתי מרקחת','סופרמרקט','תחנת דלק'];nearout.innerHTML=q.map(x=>`<a class="btn" style="margin:4px" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x)}&center=${p.coords.latitude},${p.coords.longitude}">${x}</a>`).join('')},()=>nearout.innerHTML='לא התקבלה הרשאת מיקום.'):0}
function lang(){let x=[['שלום','Përshëndetje','פֶּרְשֶׁנְדֶטְיֶה'],['תודה','Faleminderit','פָאלֶמִינְדֶרִיט'],['בבקשה','Ju lutem','יוּ לוּטֶם'],['כמה זה עולה?','Sa kushton?','סָה קוּשְטוֹן?'],['איפה השירותים?','Ku është tualeti?','קוּ אֶשְטֶה טוּאַלֶטִי?']];return title('🗣️ אלבנית שימושית','כמה מילים שעוזרות','לחצו על הרמקול להשמעה.')+`<div class="card">${x.map(a=>`<div class="phrase"><button onclick="say('${a[1]}')">🔊</button><div><b>${a[0]}</b><div dir="ltr">${a[1]}</div><small>${a[2]}</small></div></div>`).join('')}</div>`}
function say(t){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(t);u.lang='sq-AL';speechSynthesis.cancel();speechSynthesis.speak(u)}}
function webtab(){return title('🌐 המלצות','מה לבדוק סמוך ליום הטיול','מידע שמשתנה בזמן אמת.')+`<div class="tiles"><div class="tile"><div class="ico">🌤️</div><h3>מזג אוויר</h3><p>חשוב במיוחד בת׳ת, נהר שאלה והים.</p></div><div class="tile"><div class="ico">🚤</div><h3>שיט</h3><p>לאשר יום קודם שעה, איסוף ומצב הים/הנהר.</p></div><div class="tile"><div class="ico">🕒</div><h3>שעות פתיחה</h3><p>לבדוק סמוך לביקור.</p></div></div>`}
let countdownTimer;
function updateCountdown(){let remaining=Math.max(0,new Date('2026-09-14T17:20:00+03:00').getTime()-Date.now()),daysLeft=Math.floor(remaining/86400000),hoursLeft=Math.floor(remaining%86400000/3600000),minutesLeft=Math.floor(remaining%3600000/60000),secondsLeft=Math.floor(remaining%60000/1000),values=[daysLeft,hoursLeft,minutesLeft,secondsLeft],ids=['countdownDays','countdownHours','countdownMinutes','countdownSeconds'];ids.forEach((id,i)=>{let element=document.getElementById(id);if(element)element.textContent=String(values[i]).padStart(2,'0')})}
function startCountdown(){clearInterval(countdownTimer);if(tab==='plan'){updateCountdown();countdownTimer=setInterval(updateCountdown,1000)}}
function render(){renderNav();app.innerHTML=tab==='home'?home():tab==='today'?today():tab==='plan'?plan():tab==='attr'?attr():tab==='tools'?tools():tab==='food'?food():tab==='near'?near():tab==='lang'?lang():webtab();startCountdown()}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
