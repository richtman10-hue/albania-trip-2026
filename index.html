function linkPlaces(text){
  let result = text;

  Object.keys(placeQueries)
    .sort((a,b)=>b.length-a.length)
    .forEach(name=>{
      result = result.split(name).join(
        `<a target="_blank"
            href="${mapsUrl(placeQueries[name])}"
            style="color:#087487;font-weight:800;text-decoration:underline;text-underline-offset:3px">
          ${name}
        </a>`
      );
    });

  return result;
}

let autoTripDayInitialized = false;

function tripDayIndex(){
  const now = new Date();
  const start = new Date(2026,8,14); // 14.9.2026
  const end   = new Date(2026,8,24); // 24.9.2026

  const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());

  if(today < start || today > end) return -1;

  return Math.round((today-start)/86400000);
}

function initializeTripDay(){
  if(autoTripDayInitialized) return;

  const i = tripDayIndex();

  if(i >= 0 && i < days.length){
    selected = i;
  }

  autoTripDayInitialized = true;
}

function timeUntil(iso){
  const diff = new Date(iso).getTime() - Date.now();

  if(diff <= 0){
    return 'הגיע זמן הטיסה';
  }

  const totalMinutes = Math.floor(diff/60000);
  const daysLeft = Math.floor(totalMinutes/1440);
  const hoursLeft = Math.floor((totalMinutes%1440)/60);
  const minutesLeft = totalMinutes%60;

  if(daysLeft > 0){
    return `בעוד ${daysLeft} ימים, ${hoursLeft} שעות ו-${minutesLeft} דקות`;
  }

  return `בעוד ${hoursLeft} שעות ו-${minutesLeft} דקות`;
}

async function loadCurrencyRates(force=false){

  const box=document.getElementById('currencyRates');
  const updated=document.getElementById('currencyUpdated');

  if(!box) return;

  if(!force){
    const saved=localStorage.getItem('albaniaCurrencyRates');

    if(saved){
      try{
        const data=JSON.parse(saved);
        showCurrencyRates(data);
      }catch(e){}
    }
  }

  try{

    const response=
      await fetch('https://open.er-api.com/v6/latest/EUR');

    if(!response.ok){
      throw new Error('rate error');
    }

    const data=await response.json();

    const all=data.rates.ALL;
    const ils=data.rates.ILS;

    const rates={
      allToIls:(1000/all)*ils,
      allToEur:1000/all,
      eurToIls:ils,
      updated:new Date().toLocaleString('he-IL')
    };

    localStorage.setItem(
      'albaniaCurrencyRates',
      JSON.stringify(rates)
    );

    showCurrencyRates(rates);

  }catch(e){

    const saved=localStorage.getItem('albaniaCurrencyRates');

    if(saved){
      const data=JSON.parse(saved);
      showCurrencyRates(data,true);
    }else{
      box.innerHTML=
        '<p>לא ניתן כרגע לקבל שערי מטבע. נסו שוב כשיש חיבור לאינטרנט.</p>';
    }
  }
}

  if(!box) return;

  box.innerHTML=`

      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:12px">

      <div style="
        background:#f4f7f8;

        padding:14px;
        text-align:center">

        <small>1000 לק</small>
        <strong style="display:block;font-size:22px;margin-top:5px">
          ₪${rates.allToIls.toFixed(2)}
        </strong>
      </div>

      <div style="
        background:#f4f7f8;
        border-radius:16px;
        padding:14px;
        text-align:center">

        <small>1000 לק</small>
        <strong style="display:block;font-size:22px;margin-top:5px">
          €${rates.allToEur.toFixed(2)}
        </strong>
      </div>

        <small>1 יורו</small>

          ₪${rates.eurToIls.toFixed(2)}

    </div>
  `;

  if(updated){
    updated.textContent=
      (offline?'⚠️ שער אחרון שנשמר · ':'עודכן: ')
      +rates.updated;
  }
}
