<!doctype html><html lang="he" dir="rtl"><head><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>אישור</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f5;font-family:Arial,Helvetica,sans-serif;color:#10242d}.bar{position:sticky;top:0;z-index:10;background:#0c4d58;color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 2px 10px #0002}.title{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{border:0;border-radius:999px;background:#fff;color:#0c4d58;padding:9px 13px;font-weight:800;text-decoration:none;display:inline-block;white-space:nowrap}.wrap{max-width:1100px;margin:0 auto;padding:14px}.page{display:block;width:100%;height:auto;background:#fff;margin:0 auto 16px;border-radius:12px;box-shadow:0 2px 14px #0002}.note{background:#fff;padding:12px 14px;border-radius:12px;margin-bottom:12px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px;color:#48606a}@media(max-width:600px){.bar{align-items:flex-start;flex-direction:column}.actions{width:100%}.btn{font-size:14px}.wrap{padding:8px}.page{border-radius:6px;margin-bottom:10px}}
</style></head><body><div class="bar"><div class="title" id="ttl">אישור</div><div class="actions"><a class="btn" href="index.html#docs">← חזרה לאישורים</a><a class="btn" id="pdfBtn" href="#" target="_blank" rel="noopener">קובץ מקורי</a></div></div><main class="wrap"><div class="note">התצוגה הותאמה למסך כדי להציג את כל העמוד ללא חיתוך. ניתן לגלול בין העמודים. <span class="small" id="origNote"></span></div><div id="pages"></div></main><script>
(async()=>{
  const q=new URLSearchParams(location.search);
  const file=q.get('file'); const title=q.get('title')||'אישור';
  document.getElementById('ttl').textContent=title; document.title=title;
  const original=document.getElementById('pdfBtn'); const note=document.getElementById('origNote');
  const isImage=/\.(png|jpe?g|webp)$/i.test(file||'');
  const isHotel=/^docs\/(?:hotel_|koman_twin_cabins|valbone_two_e|bizant_boutique|fm2_hotel|orit_israel_(?:hotel_|koman_twin_cabins|valbone_two_e|bizant|fm2))/i.test(file||'');
  if(!file){original.style.display='none';}
  else if(isHotel||isImage){original.style.display='none'; note.textContent='';}
  else {original.href=new URL(file,location.href).href; note.textContent=' הקובץ המקורי זמין בכפתור למעלה.';}
  const box=document.getElementById('pages');
  function addImage(src,i){
    const img=document.createElement('img'); img.className='page'; img.alt=title+' - עמוד '+(i+1); img.loading='eager';
    img.src=src;
    img.onerror=()=>{
      img.remove();
      const n=document.createElement('div'); n.className='note';
      n.innerHTML='לא ניתן לטעון עמוד זה כרגע. נסו לסגור ולפתוח שוב את האישור'+(original.style.display==='none'?' בנוכחות אינטרנט.':', או השתמשו בקובץ המקורי.');
      box.appendChild(n);
    };
    box.appendChild(img);
  }
  try{
    const r=await fetch('previews-manifest.json'); if(!r.ok) throw new Error('manifest '+r.status);
    const m=await r.json(); let pages=m[file]||[];
    if(!pages.length && isImage && file) pages=[file];
    if(!pages.length){box.innerHTML='<div class="note">לא נמצאה תצוגה מקדימה למסמך זה.</div>';return;}
    pages.forEach(addImage);
  }catch(e){
    if(isImage&&file){addImage(file,0);}
    else box.innerHTML='<div class="note">לא ניתן לטעון את התצוגה כרגע. נסו שוב לאחר פתיחת האפליקציה עם חיבור לאינטרנט.</div>';
  }
})();
</script></body></html>
