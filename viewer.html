<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>אישור</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f5;font-family:Arial,Helvetica,sans-serif;color:#10242d}.bar{position:sticky;top:0;z-index:10;background:#0c4d58;color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 2px 10px #0002}.title{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{border:0;border-radius:999px;background:#fff;color:#0c4d58;padding:9px 13px;font-weight:800;text-decoration:none;display:inline-block;white-space:nowrap}.wrap{max-width:1100px;margin:0 auto;padding:14px}.page{display:block;width:100%;height:auto;background:#fff;margin:0 auto 16px;border-radius:12px;box-shadow:0 2px 14px #0002}.note{background:#fff;padding:12px 14px;border-radius:12px;margin-bottom:12px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px;color:#48606a}@media(max-width:600px){.bar{align-items:flex-start;flex-direction:column}.actions{width:100%}.btn{font-size:14px}.wrap{padding:8px}.page{border-radius:6px;margin-bottom:10px}}
</style></head><body><div class="bar"><div class="title" id="ttl">אישור</div><div class="actions"><a class="btn" href="index.html#docs">← חזרה לאישורים</a><a class="btn" id="pdfBtn" href="#" target="_blank">PDF מקורי</a></div></div><main class="wrap"><div class="note">התצוגה הותאמה למסך כדי להציג את כל העמוד ללא חיתוך. ניתן לגלול בין העמודים. <span class="small">ה-PDF המקורי נשאר זמין בכפתור למעלה.</span></div><div id="pages"></div></main><script>
(async()=>{const q=new URLSearchParams(location.search);const file=q.get('file');const title=q.get('title')||'אישור';document.getElementById('ttl').textContent=title;document.title=title;const pdf=document.getElementById('pdfBtn');pdf.href=file||'#';try{const m=await fetch('previews-manifest.json').then(r=>r.json());const pages=m[file]||[];const box=document.getElementById('pages');if(!pages.length){box.innerHTML='<div class="note">לא נמצאה תצוגה מקדימה. ניתן לפתוח את הקובץ המקורי בכפתור למעלה.</div>';return;}pages.forEach((src,i)=>{const img=document.createElement('img');img.className='page';img.src=src;img.alt=title+' - עמוד '+(i+1);img.loading='eager';box.appendChild(img);});}catch(e){document.getElementById('pages').innerHTML='<div class="note">לא ניתן לטעון את התצוגה כרגע. פתחו את ה-PDF המקורי.</div>';}})();
</script></body></html>
